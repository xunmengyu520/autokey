name: Build KeyX

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 拉取 libultrahand 依赖（tesla.hpp 等UI框架）
        run: |
          rm -rf ovl-KeyX/libs/libultrahand
          git clone --depth 1 https://github.com/ppkantorski/libultrahand ovl-KeyX/libs/libultrahand

      - name: 拉取 libnotification 依赖
        run: |
          rm -rf sys-KeyX/lib/libnotification
          git clone --depth 1 https://github.com/TOM-BadEN/NX-Notification.git sys-KeyX/lib/libnotification

      - name: 安装编译所需的额外工具
        run: |
          apt-get update
          apt-get install -y zip python-is-python3

      - name: 编译 (make all -> 生成 out/KeyX-CN.zip / KeyX-EN.zip)
        run: |
          make

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: KeyX-build-${{ github.run_number }}
          path: |
            out/KeyX-CN.zip
            out/KeyX-EN.zip
          if-no-files-found: error
